name: Keep Alive

# Evita que o GitHub desative automaticamente os workflows agendados deste
# repositório por inatividade (regra: 60+ dias sem push). Faz um commit
# vazio mensal só para manter o repositório "ativo".

on:
  workflow_dispatch:

  schedule:
    - cron: '0 12 1 * *' # dia 1 de cada mês, 12:00 UTC

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit vazio para manter o repositório ativo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive (evita desativação de workflows agendados por inatividade)"
          git push
